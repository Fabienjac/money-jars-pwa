[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Ne pas mettre `publish = "dist"` ici : sinon Netlify Dev peut servir un build statique en parallèle
# du proxy Vite et la redirection SPA casse le chargement de /src/*.tsx (MIME vide ou HTML à la place du JS).
[dev]
  framework = "vite"
  command = "vite"
  port = 8888
  targetPort = 5173
  autoLaunch = true

# SPA en production uniquement via ce fichier (évite public/_redirects lu par Netlify Dev).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité. La politique de contenu est en mode « rapport » (Report-Only) : elle signale dans la console du
# navigateur ce qu'elle bloquerait, sans rien bloquer. À passer en « Content-Security-Policy » une fois la console
# restée muette pendant quelques jours d'usage normal.
# Domaines appelés depuis le navigateur : Supabase, Frankfurter (taux de change), CoinGecko (cours des cryptos).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.frankfurter.dev https://api.frankfurter.app https://api.coingecko.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
